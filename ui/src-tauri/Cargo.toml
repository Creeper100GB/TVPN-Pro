[package]
name = "tvpn-pro"
version = "0.1.6"
description = "TVPN Pro desktop shell"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"

# Standalone crate: the service crates at the repository root are a separate
# workspace and must not drag Tauri into every cargo test.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "socks", "native-tls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tvpn-core = { path = "../../service/core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

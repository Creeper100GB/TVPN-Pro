name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust components
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse all PowerShell scripts
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-powershell.ps1

      - name: Log redaction gate self-test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/log-redaction/check-log-redaction.ps1 -SelfTest

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: ui
        run: bunx playwright install chromium

      - name: End-to-end tests
        working-directory: ui
        run: bun run e2e

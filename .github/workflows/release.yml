name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build tvpnd
        run: cargo build -p tvpnd --release --bin tvpnd

      - name: Fetch Tor Expert Bundle
        shell: powershell
        run: ./tools/fetch-tor.ps1

      - name: Build unsigned app
        working-directory: ui
        run: bun run tauri build

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $assets = "ui/src-tauri/target/release/bundle/release-assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null

          $installer = Get-ChildItem "ui/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "kein Installer gefunden" }
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $assets "TVPN-Pro-Windows-x64-Setup.exe")

          $portable = "ui/src-tauri/target/release/tvpn-pro.exe"
          if (-not (Test-Path $portable)) { throw "keine portable EXE gefunden" }
          Copy-Item -LiteralPath $portable -Destination (Join-Path $assets "TVPN-Pro-Windows-x64-Portable.exe")

          $lines = Get-ChildItem "$assets/*.exe" | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $assets "SHA256SUMS.txt")

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: tvpn-pro-windows
          path: ui/src-tauri/target/release/bundle/release-assets/*
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = "ui/src-tauri/target/release/bundle/release-assets"
          $files = Get-ChildItem $assets | Select-Object -ExpandProperty FullName
          if ($files.Count -lt 3) { throw "Release-Dateien fehlen" }
          $notes = "Unsignierter Alpha-Build für Windows. Der Installer enthält den Dienst tvpnd, WFP-Default-Deny, Tor und die UI. Die VPN-zu-Tor-Kette ist ohne Mullvad-Konto ungeprüft; MAC und Hostname sind im Hyper-V-Test nicht umgesetzt. Keine Anonymitätsgarantie.`n`nPortable (nur UI, braucht den Dienst): https://github.com/Creeper100GB/TVPN-Pro/releases/latest/download/TVPN-Pro-Windows-x64-Portable.exe`nInstaller: https://github.com/Creeper100GB/TVPN-Pro/releases/latest/download/TVPN-Pro-Windows-x64-Setup.exe`nSHA-256: https://github.com/Creeper100GB/TVPN-Pro/releases/latest/download/SHA256SUMS.txt"
          $arguments = @("release", "create", $env:GITHUB_REF_NAME, "--title", "$env:GITHUB_REF_NAME (Alpha)", "--notes", $notes) + $files
          & gh @arguments

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build unsigned installer
        working-directory: ui
        run: bun run tauri build

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "ui/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "kein Installer gefunden" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "ui/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tvpn-pro-nsis
          path: |
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "ui/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "kein Installer gefunden" }
          $sums = "ui/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"
          if (-not (Test-Path $sums)) { throw "keine Prüfsumme gefunden" }
          gh release create $env:GITHUB_REF_NAME --title "$env:GITHUB_REF_NAME (Alpha)" `
            --notes "Unsignierter Alpha-Build. Diese Version schützt noch nichts: keine Firewall, kein VPN, keine Tor-Integration. Installation: README.md. SHA-256: SHA256SUMS.txt." `
            $installer.FullName $sums

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build unsigned installer
        working-directory: ui
        run: bun run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tvpn-pro-nsis
          path: ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "ui/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "kein Installer gefunden" }
          gh release create $env:GITHUB_REF_NAME --title "$env:GITHUB_REF_NAME (Alpha)" `
            --notes "Unsignierter Alpha-Build. Diese Version schuetzt noch nichts: keine Firewall, kein VPN, keine Tor-Integration. Details: README.md" `
            $installer.FullName
